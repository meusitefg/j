<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minha Central | Contas</title>
<style>

minmax(0,1fr));gap:14px;margin:27px 0}.stat{background:white;border:1px solid var(--line);border-radius:15px;padding:20px}.stat .label{font-size:12px;color:#777;font-weight:650}.stat .value{font-size:32px;font-weight:850;letter-spacing:-1px;margin-top:8px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.toolbar h2{font-size:20px;letter-spacing:-.5px;margin:0}.search{width:min(100%,310px);padding:12px 14px;border:1px solid #ddd;border-radius:10px;background:#fff;outline:none}.search:focus,input:focus,select:focus,textarea:focus{border-color:#111;outline:none}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:19px;min-width:0}.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.tag{background:#f0f0f0;border-radius:7px;font-size:11px;font-weight:800;padding:7px 9px;max-width:75%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dots{border:0;background:transparent;font-size:21px;line-height:1;color:#888}.card h3{font-size:18px;letter-spacing:-.5px;margin:19px 0 7px;overflow-wrap:anywhere}.login{color:#666;font-size:13px;overflow-wrap:anywhere;min-height:36px}.card-actions{display:flex;gap:8px;margin-top:19px;flex-wrap:wrap}.card-actions .btn{flex:1;padding:10px 9px;font-size:12px}.empty{grid-column:1/-1;text-align:center;padding:60px 15px;background:#fff;border:1px dashed #ddd;border-radius:15px;color:#777}.empty strong{display:block;color:#111;font-size:18px;margin-bottom:7px}.empty .btn{margin-top:18px}.modal-wrap{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:15px;z-index:10}.modal-wrap.open{display:grid}.modal{background:#fff;border-radius:17px;width:min(100%,490px);padding:26px;max-height:90vh;overflow:auto;box-shadow:0 20px 90px #0003}.modal h2{margin:0 0 6px;letter-spacing:-.7px}.modal p{color:#777;font-size:13px;margin:0 0 23px}.field{display:grid;gap:7px;margin-bottom:15px}.field label{font-size:12px;font-weight:800}.field input,.field select,.field textarea{width:100%;border:1px solid #ddd;border-radius:9px;padding:12px;background:#fff;color:#111}.field textarea{resize:vertical;min-height:75px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:23px}.notice{font-size:12px;color:#888;line-height:1.5}.toast{position:fixed;bottom:22px;right:22px;background:#111;color:#fff;padding:13px 18px;border-radius:10px;box-shadow:0 10px 30px #0002;z-index:30;display:none;font-size:13px}.toast.show{display:block}.mobile-head{display:none}.topic-row{display:flex;gap:8px;align-items:center}.topic-row button:first-child{flex:1}.delete-topic{border:0;background:transparent;color:#777;border-radius:8px;padding:10px}.delete-topic:hover{background:#3a3a3a;color:white}.hidden{display:none!important}@media(max-width:850px){.app{grid-template-columns:1fr}.side{display:none}.mobile-head{display:flex;background:#111;color:#fff;padding:17px 20px;justify-content:space-between;align-items:center;gap:10px}.mobile-head .brand{padding:0;font-size:20px}.mobile-head button{background:#2d2d2d;color:white;border:0;border-radius:8px;padding:9px 12px}.side.mobile-open{display:flex;position:absolute;z-index:5;top:59px;left:0;right:0;box-shadow:0 20px 40px #0005}.main{padding:25px 17px}.stats{gap:8px}.stat{padding:15px}.stat .value{font-size:26px}.stat .label{font-size:11px}.cards{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}}@media(max-width:540px){.stats{grid-template-columns:repeat(2,1fr)}.stats .stat:last-child{grid-column:1/-1}.actions{width:100%}.actions .btn{flex:1}.toolbar{align-items:stretch}.search{width:100%}.cards{grid-template-columns:1fr}.modal{padding:21px}.toast{left:15px;right:15px;text-align:center}}
.entry{min-height:100dvh;display:grid;place-items:center;padding:20px}.panel{width:min(100%,420px);background:white;border:1px solid var(--line);border-radius:20px;padding:clamp(22px,5vw,40px)}.panel .brand{padding:0}.panel h1{font-size:clamp(24px,5vw,32px);letter-spacing:-1px;margin:30px 0 22px}.panel .btn{width:100%}.panel p:empty{display:none}.panel p{margin-bottom:0;color:#444}.field label,.field,.btn,.stat .label,.login,.nav button{font-size:.875rem}.field input,.field select,.search{font-size:1rem}.btn,.delete-topic{min-height:44px}.btn:disabled{opacity:.55;cursor:wait}.modal{border:0}.modal::backdrop{background:#0009}.modal h2{margin-bottom:20px}.side-bottom{padding:0}.delete-topic{font-size:1.2rem;color:#aaa}.card h3{margin:12px 0 5px}.login{min-height:0}.mobile-head .brand{white-space:nowrap}[hidden]{display:none!important}:focus-visible{outline:2px solid #777!important;outline-offset:2px}.tag{font-size:.8rem}.top h1{overflow-wrap:anywhere}
.account-details{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.status-select{font:inherit;font-size:.8rem;font-weight:750;border:1px solid #ddd;border-radius:8px;padding:7px 6px;min-height:36px;background:#f1f1f1;color:#222}.status-select[data-status="ON"]{color:#14532d;background:#dcfce7;border-color:#86efac}.status-select[data-status="OFF"]{color:#991b1b;background:#fee2e2;border-color:#fca5a5}.status-select[data-status="RISCO"]{color:#9a3412;background:#ffedd5;border-color:#fdba74}.status-select option{color:#111;background:#fff}.password-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:8px}.password-toggle.btn{padding:4px 8px;min-height:36px;font-size:.8rem}.password-value{white-space:pre-wrap;overflow-wrap:anywhere;font: .875rem monospace}
</style>
</head>
<body>
<main class="entry" id="entry">
  <section class="panel">
    <div class="brand">MINHA<span>CENTRAL.</span></div>
    <h1>Acesse sua central</h1>
    <form id="signIn">
      <label class="field">E-mail do administrador<input type="email" name="email" autocomplete="username" required></label>
      <label class="field">Senha<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="btn dark" type="submit">Entrar</button>
    </form>
    <p id="loginStatus" role="status" aria-live="polite"></p>
  </section>
</main>
<div id="dashboard" hidden>
<div class="mobile-head"><div class="brand">MINHA<span>CENTRAL.</span></div><button id="menuBtn">☰ Tópicos</button></div>
<div class="app"><aside class="side" id="sidebar"><div class="brand">MINHA<span>CENTRAL.</span></div><div><div class="side-label">NAVEGAÇÃO</div><div class="nav" id="nav"><button class="active" data-topic="all">▦ &nbsp; Todas as contas <span class="count" id="allCount">0</span></button></div></div><div class="side-bottom"><button class="btn" id="signOut">Sair</button></div></aside>
<main class="main"><div class="top"><div><h1 id="pageTitle">Todas as contas</h1></div><div class="actions"><button class="btn" id="newTopic">＋ Novo tópico</button><button class="btn dark" id="newAccount">＋ Adicionar login</button></div></div>
<section class="stats"><div class="stat"><div class="label">Total de logins</div><div class="value" id="statAccounts">0</div></div><div class="stat"><div class="label">Tópicos criados</div><div class="value" id="statTopics">0</div></div><div class="stat"><div class="label">Logins neste tópico</div><div class="value" id="statFiltered">0</div></div></section>
<div class="toolbar"><h2>Meus logins</h2><input class="search" id="search" type="search" placeholder="Buscar por e-mail ou tópico" aria-label="Pesquisar logins"></div><section class="cards" id="cards"></section>
</main></div>
<dialog class="modal" id="dialog" aria-labelledby="modalTitle"><h2 id="modalTitle"></h2><form id="form"><div id="fields"></div><div class="modal-actions"><button class="btn" type="button" id="cancel">Cancelar</button><button class="btn dark" type="submit" id="save">Salvar</button></div></form></dialog></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="config.js" defer></script>
<script src="app.js?v=2" defer></script>
</body></html>
